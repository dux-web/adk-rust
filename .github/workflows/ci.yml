name: Windows enforcer diagnostics

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Revision to check out
        required: false
        type: string
      test_target:
        description: Sandbox integration test target
        type: choice
        default: windows_spawn_diagnostics
        options:
          - windows_spawn_diagnostics
          - windows_enforcer_tests

permissions:
  contents: read

jobs:
  windows-enforcer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: windows-enforcer-diagnostics
          cache-save: 'true'
      - name: Build the native probe without a dynamic CRT
        if: inputs.test_target == 'windows_spawn_diagnostics'
        run: |
          rustc --edition=2024 -C target-feature=+crt-static adk-sandbox/tests/support/windows_peer.rs -o windows-peer.exe
          "ADK_WINDOWS_PROBE_EXE=$((Resolve-Path windows-peer.exe).Path)" >> $env:GITHUB_ENV
      - name: Run the selected Windows enforcer tests
        env:
          TEST_TARGET: ${{ inputs.test_target }}
        run: cargo test --locked -p adk-sandbox --features sandbox-windows --test "$env:TEST_TARGET" -- --nocapture
