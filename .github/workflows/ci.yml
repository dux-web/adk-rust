name: Enforcer diagnostics

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Revision to check out
        required: false
        type: string
      linux_suite:
        description: Run a scoped Linux suite under the PR Nix environment
        required: false
        type: choice
        default: none
        options:
          - none
          - kernel
          - team
      changelog_only:
        description: Validate UTF-8 fragments without rebuilding unchanged Rust inputs
        required: false
        type: boolean
        default: false
      strict:
        description: Run formatting, changelog, lint and Windows token unit checks
        required: false
        type: boolean
        default: false
      trace:
        description: Capture the native child failure with Process Monitor
        required: false
        type: boolean
        default: false
      test_target:
        description: Sandbox integration test target
        type: choice
        default: windows_spawn_diagnostics
        options:
          - windows_spawn_diagnostics
          - windows_enforcer_tests

permissions:
  contents: read

jobs:
  changelog:
    if: inputs.changelog_only
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Validate UTF-8 changelog fragments
        run: python -X utf8 scripts/changelog-assemble.py --check
  windows-enforcer:
    if: ${{ !inputs.changelog_only && inputs.linux_suite == 'none' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: windows-enforcer-diagnostics
          cache-save: 'true'
      - name: Validate the scoped Windows changes
        if: inputs.strict
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 scripts/changelog-assemble.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked -p adk-sandbox --features sandbox-windows --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p adk-sandbox --features sandbox-windows --lib sandbox::windows::tests -- --nocapture
      - name: Build the native probe without a dynamic CRT
        if: inputs.test_target == 'windows_spawn_diagnostics'
        run: |
          rustc --edition=2024 -C target-feature=+crt-static adk-sandbox/tests/support/windows_peer.rs -o windows-peer.exe
          "ADK_WINDOWS_PROBE_EXE=$((Resolve-Path windows-peer.exe).Path)" >> $env:GITHUB_ENV
      - name: Prepare a short native child trace
        if: inputs.trace
        run: |
          cargo test --locked -p adk-sandbox --features sandbox-windows --test windows_spawn_diagnostics --no-run
          $tool = Join-Path $env:RUNNER_TEMP 'Procmon64.exe'
          Invoke-WebRequest 'https://live.sysinternals.com/Procmon64.exe' -OutFile $tool
          $signature = Get-AuthenticodeSignature $tool
          $signature | Select-Object Status, @{Name='Signer';Expression={$_.SignerCertificate.Subject}}
          if ($signature.Status -ne 'Valid') { throw 'The diagnostic tool signature is invalid' }
          Get-FileHash $tool -Algorithm SHA256
          $trace = Join-Path $env:RUNNER_TEMP 'restricted-spawn.pml'
          $capture = Start-Process $tool -ArgumentList @('-accepteula', '-backingfile', $trace, '-quiet', '-minimized') -PassThru
          "ADK_PROCMON_PID=$($capture.Id)" >> $env:GITHUB_ENV
          Start-Sleep -Seconds 3
      - name: Run the selected Windows enforcer tests
        env:
          TEST_TARGET: ${{ inputs.test_target }}
          TRACE: ${{ inputs.trace }}
        run: |
          if ($env:TRACE -eq 'true') {
            cargo test --locked -p adk-sandbox --features sandbox-windows --test "$env:TEST_TARGET" native_child_launch -- --nocapture
          } else {
            cargo test --locked -p adk-sandbox --features sandbox-windows --test "$env:TEST_TARGET" -- --nocapture
          }
      - name: Stop the capture and print relevant denied operations
        if: always() && inputs.trace
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'Procmon64.exe'
          & $tool -terminate -quiet
          if ($env:ADK_PROCMON_PID) {
            Wait-Process -Id $env:ADK_PROCMON_PID -Timeout 30 -ErrorAction SilentlyContinue
          }
          $trace = Join-Path $env:RUNNER_TEMP 'restricted-spawn.pml'
          $csv = Join-Path $env:RUNNER_TEMP 'restricted-spawn.csv'
          $export = Start-Process $tool -ArgumentList @('-openlog', $trace, '-saveas', $csv, '-quiet') -PassThru
          if (-not $export.WaitForExit(60000)) { $export.Kill(); throw 'Trace export timed out' }
          Get-Item $trace, $csv | Select-Object Name, Length
          Import-Csv $csv | Where-Object {
            $_.'Process Name' -in @('windows-peer.exe', 'cmd.exe', 'localcmd.exe') -and $_.Result -ne 'SUCCESS'
          } | Select-Object -Last 100 'Time of Day', 'Process Name', PID, Operation, Path, Result, Detail | Format-List

  nix-runtime:
    if: inputs.linux_suite != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Record the source revision
        run: git rev-parse HEAD
      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: devenv
      - run: nix profile install nixpkgs#devenv
      - name: Run the scoped tests
        env:
          SUITE: ${{ inputs.linux_suite }}
        run: |
          set -euo pipefail
          if [[ "$SUITE" == kernel ]]; then
            CI=true devenv shell cargo nextest run --locked -p adk-kernel --features drivers,sqlite --test driver_ledger_property_tests --test driver_park_restart --no-fail-fast
          else
            CI=true devenv shell cargo nextest run --locked -p adk-agent --features team-tools --lib -E 'test(team::tests::)' --no-fail-fast
          fi
      - name: Record executable interpreters
        if: always()
        run: |
          python3 - <<'PYTHON'
          import pathlib, subprocess
          for path in pathlib.Path('target/debug/deps').glob('driver_*'):
              if path.suffix or not path.is_file():
                  continue
              with path.open('rb') as stream:
                  if stream.read(4) != b'\x7fELF':
                      continue
              print(path, flush=True)
              result = subprocess.run(['/usr/bin/readelf', '-l', str(path)], capture_output=True, text=True)
              for line in result.stdout.splitlines():
                  if 'interpreter' in line:
                      print(line)
          PYTHON
